[package]
name = "axutils-email-feature-matrix"
version = "0.0.0"
edition = "2021"
publish = false

[features]
sync = ["axutils/lettre"]
all = ["axutils/lettre", "axutils/tokio"]
tokio-only = ["axutils/tokio"]
negative-email-module = []
negative-email-client = []
negative-email-utils = []
