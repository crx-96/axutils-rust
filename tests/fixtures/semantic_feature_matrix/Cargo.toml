[package]
name = "axutils-semantic-feature-matrix"
version = "0.0.0"
edition = "2021"
publish = false

[features]
phone-validation = ["axutils/phone-validation"]
template-strfmt = ["axutils/template-strfmt"]
template-minijinja = ["axutils/template-minijinja"]
tokio = ["axutils/tokio"]
task-group = ["axutils/task-group"]
scheduler = ["axutils/scheduler"]
axum = ["axutils/axum"]
axum-tower = ["axutils/axum-tower"]
axum-tower-http = ["axutils/axum-tower-http"]
axum-governor = ["axutils/axum-governor"]
fs-async = ["axutils/fs-async"]
fs-temp = ["axutils/fs-temp"]
fs-temp-async = ["axutils/fs-temp-async"]
config = ["axutils/config"]
config-yaml = ["axutils/config-yaml"]
config-toml = ["axutils/config-toml"]
config-ini = ["axutils/config-ini"]
config-async = ["axutils/config-async"]
email = ["axutils/email"]
email-async = ["axutils/email-async"]
http = ["axutils/http"]
http-async = ["axutils/http-async"]
http-json = ["axutils/http-json"]
http-async-json = ["axutils/http-async", "axutils/http-json"]
redis = ["axutils/redis"]
redis-cluster = ["axutils/redis-cluster"]
redis-async = ["axutils/redis-async"]
redis-cluster-async = ["axutils/redis-cluster-async"]
sqlx-postgres = ["axutils/sqlx-postgres"]
sqlx-mysql = ["axutils/sqlx-mysql"]
sqlx-sqlite = ["axutils/sqlx-sqlite"]
sqlx = ["axutils/sqlx"]
itoa = ["axutils/itoa"]
ryu = ["axutils/ryu"]
zmij = ["axutils/zmij"]
uuid = ["axutils/uuid", "dep:uuid"]
convert-float-both = ["ryu", "zmij"]
convert-all = ["itoa", "ryu", "zmij", "uuid"]
rand = ["axutils/rand"]
regex = ["axutils/regex"]
chrono = ["axutils/chrono", "dep:chrono"]
time = ["axutils/time", "dep:time"]
jiff = ["axutils/jiff", "dep:jiff"]
chrono-time = ["chrono", "time"]
chrono-jiff = ["chrono", "jiff"]
time-jiff = ["time", "jiff"]
time-all = ["chrono", "time", "jiff"]
base64 = ["axutils/base64"]
md5 = ["axutils/md5"]
aes = ["axutils/aes"]
encoding_rs = ["axutils/encoding_rs"]
aes-base64 = ["aes", "base64"]
crypto-all = ["base64", "md5", "aes", "encoding_rs"]
jwt = ["axutils/jwt"]
tracing = ["axutils/tracing"]
logging = ["axutils/logging"]

negative-legacy-paths = [
    "axutils/axum",
    "axutils/config",
    "axutils/email",
    "axutils/http",
    "axutils/jwt",
    "axutils/logging",
    "axutils/redis",
    "axutils/scheduler",
    "axutils/sqlx-postgres",
    "axutils/tokio",
]
negative-phone-provider = ["axutils/regex"]
negative-template-engine = ["axutils/template-strfmt"]
negative-task-group = ["axutils/tokio"]
negative-tokio-isolation = ["axutils/tokio"]
negative-scheduler = ["axutils/tokio"]
negative-axum-facade = ["axutils/axum"]
negative-axum-tower = ["axutils/axum"]
negative-axum-tower-http = ["axutils/axum"]
negative-axum-governor = ["axutils/axum"]
negative-fs-async = []
negative-fs-temp = []
negative-fs-temp-async = ["axutils/fs-temp-async"]
negative-config-yaml = ["axutils/config"]
negative-config-toml = ["axutils/config"]
negative-config-ini = ["axutils/config"]
negative-config-async = ["axutils/config"]
negative-email-async = ["axutils/email"]
negative-http-async = ["axutils/http"]
negative-http-json = ["axutils/http"]
negative-redis-cluster = ["axutils/redis"]
negative-redis-async = ["axutils/redis"]
negative-sqlx-root = ["axutils/sqlx-postgres"]
negative-sqlx-old-init = ["axutils/sqlx-postgres"]
negative-convert-integer = []
negative-convert-float = []
negative-convert-uuid = []
negative-convert-ryu = ["axutils/zmij"]
negative-convert-zmij = ["axutils/ryu"]
negative-convert-sealed = ["axutils/itoa"]
negative-rand = []
negative-redis-random = ["axutils/redis"]
negative-base64 = []
negative-md5 = []
negative-aes = []
negative-encoding-rs = []
negative-aes-base64 = ["axutils/aes"]
negative-jwt = []
negative-jwt-config = ["axutils/jwt"]
negative-logging = ["axutils/tracing"]
negative-time-unsuffixed-chrono = ["chrono"]
negative-time-unsuffixed-all = ["time-all"]

[dependencies]
axutils = { path = "../../..", default-features = false }
uuid = { version = "1.24.0", default-features = false, features = ["std"], optional = true }
chrono = { version = "0.4.45", default-features = false, optional = true }
time = { version = "0.3.36", default-features = false, optional = true }
jiff = { version = "0.2.35", default-features = false, optional = true }
