[package]
name = "config-arbitrary-precision-regression"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[features]
jwt = ["axutils/jwt", "dep:serde"]
jwt-dual-provider = ["jwt", "dep:jsonwebtoken"]

[dependencies]
axutils = { path = "../../../..", default-features = false, features = ["config"] }
jsonwebtoken = { version = "12", default-features = false, features = ["aws_lc_rs"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }

[[test]]
name = "untyped_json"
path = "untyped_json.rs"
