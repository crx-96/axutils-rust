[package]
name = "axutils-config-feature-matrix"
version = "0.0.0"
edition = "2021"
publish = false

[features]
serde-only = ["axutils/serde"]
serde-toml = ["axutils/serde", "axutils/toml"]
serde-tokio = ["axutils/serde", "axutils/tokio"]
serde-yaml = ["axutils/serde", "axutils/serde-saphyr"]
serde-tokio-yaml = ["axutils/serde", "axutils/tokio", "axutils/serde-saphyr"]
all = ["axutils/serde", "axutils/toml", "axutils/serde-saphyr", "axutils/rust-ini"]
serde-tokio-all = [
    "axutils/serde",
    "axutils/tokio",
    "axutils/toml",
    "axutils/serde-saphyr",
    "axutils/rust-ini",
]
tokio-only = ["axutils/tokio"]
negative-tokio-config-no-serde = ["axutils/tokio"]
negative-config-module-no-serde = []
negative-config-utils-no-serde = []
negative-toml-only-no-serde = ["axutils/toml"]
negative-yaml-only-no-serde = ["axutils/serde-saphyr"]
negative-config-async-no-tokio = ["axutils/serde"]
negative-yaml-under-serde-only = ["axutils/serde"]
negative-toml-under-serde-only = ["axutils/serde"]
negative-ini-under-serde-only = ["axutils/serde"]
negative-yaml-under-serde-tokio = ["axutils/serde", "axutils/tokio"]
negative-toml-under-serde-tokio = ["axutils/serde", "axutils/tokio"]
negative-ini-under-serde-tokio = ["axutils/serde", "axutils/tokio"]

[dependencies]
axutils = { path = "../../..", default-features = false }
