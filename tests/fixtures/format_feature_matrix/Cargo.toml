[package]
name = "axutils-format-feature-matrix"
version = "0.0.0"
edition = "2021"
publish = false

[features]
format-serde-strfmt = ["axutils/serde", "axutils/strfmt"]
format-serde-minijinja = ["axutils/serde", "axutils/minijinja"]
format-serde-all = ["axutils/serde", "axutils/strfmt", "axutils/minijinja"]
negative-format-no-features = []
negative-format-serde-only = ["axutils/serde"]
negative-format-strfmt-only = ["axutils/strfmt"]
negative-format-minijinja-only = ["axutils/minijinja"]
negative-format-serde-strfmt-missing-minijinja = ["axutils/serde", "axutils/strfmt"]
negative-format-serde-minijinja-missing-strfmt = ["axutils/serde", "axutils/minijinja"]

[dependencies]
axutils = { path = "../../..", default-features = false }
serde = { version = "1", features = ["derive"] }
