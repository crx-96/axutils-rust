[package]
name = "axutils-sqlx-feature-matrix"
version = "0.0.0"
edition = "2021"
publish = false

[features]
none = []
tokio-only = ["axutils/tokio"]
sqlx-only = ["axutils/sqlx"]
sqlx-tokio = ["axutils/sqlx", "axutils/tokio", "direct-sqlx"]
direct-sqlx = ["dep:sqlx"]

negative-no-sqlx-module = []
negative-no-sqlx-root = []
negative-no-sqlx-utils = []
negative-sqlx-only-module = ["axutils/sqlx"]
negative-sqlx-only-root = ["axutils/sqlx"]
negative-sqlx-only-utils = ["axutils/sqlx"]
negative-sqlx-only-async = ["axutils/sqlx"]
negative-tokio-module = ["axutils/tokio"]
negative-tokio-root = ["axutils/tokio"]
negative-tokio-utils = ["axutils/tokio"]
negative-tokio-async = ["axutils/tokio"]
negative-dynamic-sql = ["axutils/sqlx", "axutils/tokio"]

[dependencies]
axutils = { path = "../../..", default-features = false }
sqlx = { version = "0.9.0", default-features = false, features = ["any", "postgres", "mysql", "sqlite-bundled", "runtime-tokio"], optional = true }
