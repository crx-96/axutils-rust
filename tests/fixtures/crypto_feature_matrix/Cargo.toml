[package]
name = "axutils-crypto-feature-matrix"
version = "0.0.0"
edition = "2021"
publish = false

[features]
none = []
encoding-rs-only = ["axutils/encoding_rs"]
base64-only = ["axutils/base64"]
md5-only = ["axutils/md5"]
aes-only = ["axutils/aes"]
base64-md5 = ["axutils/base64", "axutils/md5"]
base64-aes = ["axutils/base64", "axutils/aes"]
base64-encoding-rs = ["axutils/base64", "axutils/encoding_rs"]
md5-aes = ["axutils/md5", "axutils/aes"]
md5-encoding-rs = ["axutils/md5", "axutils/encoding_rs"]
aes-encoding-rs = ["axutils/aes", "axutils/encoding_rs"]
base64-md5-aes = ["axutils/base64", "axutils/md5", "axutils/aes"]
base64-md5-encoding-rs = ["axutils/base64", "axutils/md5", "axutils/encoding_rs"]
base64-aes-encoding-rs = ["axutils/base64", "axutils/aes", "axutils/encoding_rs"]
md5-aes-encoding-rs = ["axutils/md5", "axutils/aes", "axutils/encoding_rs"]
all = ["axutils/base64", "axutils/md5", "axutils/aes", "axutils/encoding_rs"]

negative-none-base64 = []
negative-none-md5 = []
negative-none-aes = []
negative-none-legacy-encoding = []
negative-encoding-rs-only-base64 = ["axutils/encoding_rs"]
negative-encoding-rs-only-md5 = ["axutils/encoding_rs"]
negative-encoding-rs-only-aes = ["axutils/encoding_rs"]
negative-base64-only-md5 = ["axutils/base64"]
negative-base64-only-aes = ["axutils/base64"]
negative-base64-only-legacy-encoding = ["axutils/base64"]
negative-md5-only-base64 = ["axutils/md5"]
negative-md5-only-aes = ["axutils/md5"]
negative-md5-only-legacy-encoding = ["axutils/md5"]
negative-aes-only-base64 = ["axutils/aes"]
negative-aes-only-md5 = ["axutils/aes"]
negative-aes-only-legacy-encoding = ["axutils/aes"]
negative-aes-only-aes-base64-combo = ["axutils/aes"]
negative-aes-base64-md5 = ["axutils/aes", "axutils/base64"]
negative-aes-base64-legacy-encoding = ["axutils/aes", "axutils/base64"]
negative-base64-encoding-rs-md5 = ["axutils/base64", "axutils/encoding_rs"]
negative-base64-encoding-rs-aes = ["axutils/base64", "axutils/encoding_rs"]
negative-base64-md5-aes = ["axutils/base64", "axutils/md5"]
negative-base64-md5-legacy-encoding = ["axutils/base64", "axutils/md5"]
negative-base64-md5-encoding-rs = ["axutils/base64", "axutils/md5", "axutils/encoding_rs"]
negative-md5-aes-base64-combo = ["axutils/md5", "axutils/aes"]
negative-md5-aes-legacy-encoding = ["axutils/md5", "axutils/aes"]
negative-md5-aes-encoding-rs = ["axutils/md5", "axutils/aes", "axutils/encoding_rs"]
negative-md5-aes-encoding-rs-base64-combo = ["axutils/md5", "axutils/aes", "axutils/encoding_rs"]
negative-md5-encoding-rs-base64 = ["axutils/md5", "axutils/encoding_rs"]
negative-md5-encoding-rs-aes = ["axutils/md5", "axutils/encoding_rs"]
negative-aes-encoding-rs-base64-combo = ["axutils/aes", "axutils/encoding_rs"]
negative-aes-encoding-rs-md5 = ["axutils/aes", "axutils/encoding_rs"]
negative-base64-md5-aes-encoding-rs = ["axutils/base64", "axutils/md5", "axutils/aes"]
negative-base64-aes-encoding-rs-md5 = ["axutils/base64", "axutils/aes", "axutils/encoding_rs"]

[dependencies]
axutils = { path = "../../..", default-features = false }
