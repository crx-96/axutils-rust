[package]
name = "axutils-redis-feature-matrix"
version = "0.0.0"
edition = "2021"
publish = false

[features]
none = []
tokio-only = ["axutils/tokio"]
redis = ["axutils/redis"]
redis-tokio = ["axutils/redis", "axutils/tokio"]
redis-serde = ["axutils/redis", "axutils/serde"]
redis-tokio-serde = ["axutils/redis", "axutils/tokio", "axutils/serde"]
all = ["axutils/redis", "axutils/tokio", "axutils/serde"]

negative-no-redis-module = []
negative-no-redis-root = []
negative-no-redis-utils = []
negative-tokio-redis-module = ["axutils/tokio"]
negative-tokio-redis-root = ["axutils/tokio"]
negative-tokio-redis-utils = ["axutils/tokio"]
negative-redis-async = ["axutils/redis"]
negative-redis-async-lock = ["axutils/redis"]
negative-redis-utils-async = ["axutils/redis"]
negative-redis-config = ["axutils/redis"]

[dependencies]
axutils = { path = "../../..", default-features = false }
