[package]
name = "axutils-fs-feature-matrix"
version = "0.0.0"
edition = "2021"
publish = false

[features]
serde-only = ["axutils/serde"]
tokio-only = ["axutils/tokio"]
serde-tokio = ["axutils/serde", "axutils/tokio"]
tempfile-only = ["axutils/tempfile"]
tokio-tempfile = ["axutils/tokio", "axutils/tempfile"]
tempfile-async = ["axutils/tempfile-async"]
tempfile-both = ["axutils/tempfile", "axutils/tempfile-async"]
all = ["axutils/serde", "axutils/tokio", "axutils/tempfile", "axutils/tempfile-async"]
negative-no-tokio-async = ["axutils/serde"]
negative-tokio-no-tempfile = ["axutils/tokio"]
negative-no-tempfile-sync = []
negative-no-tempfile-async = ["axutils/tokio"]
negative-tempfile-only-async = ["axutils/tempfile"]
negative-tempfile-async-sync = ["axutils/tempfile-async"]
negative-no-domain-fs-utils = []
negative-no-domain-fs-operation = []
negative-no-domain-fs-transfer = []
negative-no-utils-fs-transfer = []
negative-no-utils-fs-temp = ["axutils/tempfile"]
negative-no-root-fs-utils-module = []
negative-no-utils-fs-error = []
negative-no-nested-fs-error = []

[dependencies]
axutils = { path = "../../..", default-features = false }
