name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        toolchain: ["1.85.0", stable]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check default feature boundary
        run: cargo check --no-default-features

      - name: Check tokio-only feature boundary
        run: cargo check --no-default-features --features tokio

      - name: Check synchronous email feature
        run: cargo check --no-default-features --features lettre

      - name: Check asynchronous email feature
        run: cargo check --no-default-features --features lettre,tokio

      - name: Run synchronous email tests
        run: cargo test --no-default-features --features lettre

      - name: Run asynchronous email tests
        run: cargo test --no-default-features --features lettre,tokio

      - name: Run no-default-feature tests
        run: cargo test --no-default-features

      - name: Run all-feature tests
        run: cargo test --all-features

      - name: Run documentation tests
        run: cargo test --doc --all-features

      - name: Run synchronous documentation tests
        run: cargo test --doc --no-default-features --features lettre

      - name: Run asynchronous documentation tests
        run: cargo test --doc --no-default-features --features lettre,tokio

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Inspect publish package contents
        run: cargo package --list
