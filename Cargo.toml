[package]
name = "axutils"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
resolver = "3"
description = "Rust utility library with opt-in feature modules"
license = "MIT"
readme = "README.md"
repository = "https://github.com/crx-96/axutils-rust"
keywords = ["utilities", "http", "database", "cryptography", "configuration"]
categories = [
    "web-programming::http-server",
    "web-programming::http-client",
    "database",
    "cryptography",
    "config",
]

# Keep developer-only files out of the package published to crates.io.
include = [
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "src/**",
    "docs/examples/**",
]

[package.metadata.docs.rs]
no-default-features = true
features = [
    "itoa",
    "ryu",
    "zmij",
    "uuid",
    "jwt",
    "tracing",
    "logging",
    "rand",
    "regex",
    "phone-validation",
    "template-strfmt",
    "template-minijinja",
    "chrono",
    "time",
    "jiff",
    "email",
    "email-async",
    "http",
    "http-async",
    "http-json",
    "redis",
    "redis-cluster",
    "redis-async",
    "redis-cluster-async",
    "sqlx",
    "tokio",
    "task-group",
    "scheduler",
    "axum",
    "axum-tower",
    "axum-tower-http",
    "axum-governor",
    "fs-async",
    "fs-temp",
    "fs-temp-async",
    "config",
    "config-yaml",
    "config-toml",
    "config-ini",
    "config-async",
    "base64",
    "md5",
    "aes",
    "encoding_rs",
]

[lib]
name = "axutils"
path = "src/lib.rs"
crate-type = ["lib"]

[features]
default = []
itoa = ["dep:itoa"]
ryu = ["dep:ryu"]
zmij = ["dep:zmij"]
uuid = ["dep:uuid"]
jwt = ["dep:jsonwebtoken", "dep:serde", "dep:serde_json"]
tracing = ["dep:tracing"]
logging = ["tracing", "dep:tracing-subscriber", "dep:tracing-appender"]
rand = ["dep:rand"]
regex = ["dep:regex"]
phone-validation = ["regex", "dep:libphonenumber"]
template-strfmt = ["dep:serde", "dep:serde_json", "dep:strfmt"]
template-minijinja = ["dep:serde", "dep:minijinja"]
chrono = ["dep:chrono"]
time = ["dep:time"]
jiff = ["dep:jiff"]
email = ["dep:lettre"]
email-async = ["email", "dep:tokio", "lettre/tokio1-rustls", "tokio?/rt"]
http = ["dep:ureq", "dep:url"]
http-async = [
    "http",
    "dep:reqwest",
    "dep:tokio",
    "tokio?/rt",
    "tokio?/sync",
    "tokio?/time",
]
http-json = [
    "http",
    "dep:serde",
    "dep:serde_json",
    "dep:serde_urlencoded",
]
redis = [
    "dep:redis",
    "dep:r2d2",
    "dep:rand",
    "dep:serde",
    "dep:rmp-serde",
    "redis/r2d2",
]
redis-cluster = ["redis", "redis/cluster"]
redis-async = [
    "redis",
    "dep:tokio",
    "redis/tokio-comp",
    "redis/connection-manager",
    "tokio?/rt",
    "tokio?/sync",
    "tokio?/time",
]
redis-cluster-async = [
    "redis-cluster",
    "redis-async",
    "redis/cluster-async",
]
sqlx-postgres = [
    "dep:sqlx",
    "dep:futures-util",
    "dep:tokio",
    "sqlx?/any",
    "sqlx?/postgres",
    "sqlx?/runtime-tokio",
    "tokio?/rt",
]
sqlx-mysql = [
    "dep:sqlx",
    "dep:futures-util",
    "dep:tokio",
    "sqlx?/any",
    "sqlx?/mysql",
    "sqlx?/runtime-tokio",
    "tokio?/rt",
]
sqlx-sqlite = [
    "dep:sqlx",
    "dep:futures-util",
    "dep:tokio",
    "sqlx?/any",
    "sqlx?/sqlite-bundled",
    "sqlx?/runtime-tokio",
    "tokio?/rt",
]
sqlx = ["sqlx-postgres", "sqlx-mysql", "sqlx-sqlite"]
tokio = [
    "dep:tokio",
    "tokio/fs",
    "tokio/io-util",
    "tokio/net",
    "tokio/rt",
    "tokio/rt-multi-thread",
    "tokio/signal",
    "tokio/sync",
    "tokio/time",
]
task-group = ["tokio", "dep:tokio-util", "tokio-util/rt", "dep:futures-timer"]
scheduler = [
    "dep:chrono",
    "dep:chrono_tz",
    "dep:croner",
    "dep:tokio",
    "tokio?/rt",
    "tokio?/time",
]
axum = [
    "dep:axum",
    "dep:tower",
    "dep:tokio",
    "axum?/http1",
    "axum?/tokio",
    "tokio?/net",
    "tokio?/rt",
    "tokio?/signal",
    "tokio?/sync",
]
axum-tower = ["axum", "tower/util", "tower/limit", "tower/load-shed"]
axum-tower-http = [
    "axum",
    "dep:tower-http",
    "axum?/matched-path",
    "tower-http/catch-panic",
    "tower-http/cors",
    "tower-http/limit",
    "tower-http/request-id",
    "tower-http/timeout",
    "tower-http/trace",
]
axum-governor = [
    "axum",
    "dep:tower_governor",
    "tower_governor/axum",
    "dep:futures-timer",
]
fs-async = ["dep:tokio", "tokio?/fs", "tokio?/io-util", "tokio?/rt"]
fs-temp = ["dep:tempfile"]
fs-temp-async = ["dep:async-tempfile", "dep:tokio", "tokio?/fs", "tokio?/rt"]
config = ["dep:serde", "dep:serde_json"]
config-yaml = ["config", "dep:serde-saphyr"]
config-toml = ["config", "dep:toml"]
config-ini = ["config", "dep:rust-ini"]
config-async = [
    "config",
    "dep:tokio",
    "tokio?/fs",
    "tokio?/io-util",
    "tokio?/rt",
]
base64 = ["dep:base64"]
md5 = ["dep:md5"]
aes = ["dep:aes", "dep:aes-gcm", "dep:cbc", "dep:zeroize"]
encoding_rs = ["dep:encoding_rs"]

[lints.clippy]
absolute_paths = "deny"

[dependencies]
itoa = { version = "1.0.18", optional = true, default-features = false }
ryu = { version = "1.0.23", optional = true, default-features = false }
zmij = { version = "1.0.23", optional = true, default-features = false }
uuid = { version = "1.24.0", optional = true, default-features = false, features = [
    "std",
] }
jsonwebtoken = { version = "11.0.0", default-features = false, features = [
    "rust_crypto",
    "use_pem",
], optional = true }
rand = { version = "0.10.2", optional = true }
regex = { version = "1", optional = true }
libphonenumber = { package = "phonenumber", version = "0.3", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["unbounded_depth"], optional = true }
serde_urlencoded = { version = "0.7.1", optional = true }
strfmt = { version = "0.2", optional = true }
minijinja = { version = "2.24.0", default-features = false, features = [
    "serde",
], optional = true }
chrono = { version = "0.4.45", default-features = false, optional = true }
chrono_tz = { package = "chrono-tz", version = "0.10.4", default-features = false, optional = true }
croner = { version = "3.0.1", default-features = false, optional = true }
time = { version = "0.3.36", default-features = false, optional = true }
jiff = { version = "0.2.35", default-features = false, optional = true }
lettre = { version = "0.11.23", default-features = false, optional = true, features = [
    "builder",
    "smtp-transport",
    "pool",
    "rustls",
    "ring",
    "webpki-roots",
] }
ureq = { version = "3.4.0", default-features = false, features = [
    "rustls",
], optional = true }
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
], optional = true }
redis = { version = "1.5.0", default-features = false, optional = true }
sqlx = { version = "0.9.0", default-features = false, optional = true }
futures-util = { version = "0.3.34", default-features = false, features = [
    "alloc",
], optional = true }
r2d2 = { version = "0.8.10", optional = true }
rmp-serde = { version = "1.3.1", optional = true }
url = { version = "2.5.8", default-features = false, features = [
    "std",
], optional = true }
tokio = { version = "1.53.1", default-features = false, optional = true }
axum = { version = "0.8.9", default-features = false, optional = true }
tokio-util = { version = "0.7.19", default-features = false, optional = true }
futures-timer = { version = "3.0.3", default-features = false, optional = true }
tower = { version = "0.5.3", default-features = false, optional = true }
tower-http = { version = "0.7.0", default-features = false, optional = true }
tower_governor = { version = "0.8.0", default-features = false, optional = true }
tempfile = { version = "3.27", default-features = false, optional = true }
async-tempfile = { version = "0.8", default-features = false, optional = true }
toml = { version = "1.1.4", default-features = false, features = [
    "parse",
    "serde",
    "std",
], optional = true }
serde-saphyr = { version = "1.0.1", default-features = false, features = [
    "deserialize",
], optional = true }
rust-ini = { version = "0.21.3", default-features = false, optional = true }
base64 = { version = "0.23.1", default-features = false, features = [
    "std",
], optional = true }
md5 = { package = "md-5", version = "0.11.0", default-features = false, optional = true }
aes = { version = "0.9.2", default-features = false, features = [
    "zeroize",
], optional = true }
aes-gcm = { version = "0.11.0", default-features = false, features = [
    "aes",
    "alloc",
    "getrandom",
    "zeroize",
], optional = true }
cbc = { version = "0.2.1", default-features = false, features = [
    "alloc",
    "block-padding",
    "zeroize",
], optional = true }
zeroize = { version = "1.9.0", default-features = false, optional = true }
encoding_rs = { version = "0.8.35", default-features = false, features = [
    "alloc",
], optional = true }
tracing = { version = "0.1.44", default-features = false, features = [
    "std",
], optional = true }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
], optional = true }
tracing-appender = { version = "0.2.5", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = [
    "macros",
    "io-util",
    "rt-multi-thread",
    "time",
    "test-util",
] }
redis-test = "1.0.4"
rustls = { version = "0.23.43", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "fmt",
] }
