[package]
name = "axutils"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
resolver = "3"
description = "Rust utility library with opt-in feature modules"
license = "MIT"
readme = "README.md"
repository = "https://github.com/crx-96/axutils-rust"
keywords = ["utilities", "validation", "regex"]
categories = ["development-tools"]

# Keep developer-only files out of the package published to crates.io.
include = ["Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE", "src/**", "docs/examples/**"]

[lib]
name = "axutils"
path = "src/lib.rs"
crate-type = ["lib"]

[features]
default = []
jwt = ["dep:jsonwebtoken", "dep:serde", "dep:serde_json"]
rand = ["dep:rand"]
regex = ["dep:regex"]
libphonenumber = ["dep:libphonenumber"]
serde = ["dep:serde", "dep:serde_json"]
strfmt = ["dep:strfmt"]
minijinja = ["dep:minijinja"]
chrono = ["dep:chrono"]
time = ["dep:time"]
jiff = ["dep:jiff"]
lettre = ["dep:lettre"]
tokio = ["dep:tokio", "lettre?/tokio1-rustls"]
toml = ["dep:toml"]
serde-saphyr = ["dep:serde-saphyr"]
rust-ini = ["dep:rust-ini"]
base64 = ["dep:base64"]
md5 = ["dep:md5"]
aes = ["dep:aes", "dep:aes-gcm", "dep:cbc", "dep:zeroize"]
encoding_rs = ["dep:encoding_rs"]

[dependencies]
jsonwebtoken = { version = "11.0.0", default-features = false, features = [
    "rust_crypto",
    "use_pem",
], optional = true }
rand = { version = "0.9", optional = true }
regex = { version = "1", optional = true }
libphonenumber = { package = "phonenumber", version = "0.3", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
strfmt = { version = "0.2", optional = true }
minijinja = { version = "2", default-features = false, features = ["serde"], optional = true }
chrono = { version = "0.4.45", default-features = false, optional = true }
time = { version = "0.3.36", default-features = false, optional = true }
jiff = { version = "0.2.35", default-features = false, optional = true }
lettre = { version = "0.11.22", default-features = false, optional = true, features = [
    "builder",
    "smtp-transport",
    "pool",
    "rustls",
    "ring",
    "webpki-roots",
] }
tokio = { version = "1.53.1", default-features = false, features = ["fs", "io-util"], optional = true }
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde", "std"], optional = true }
serde-saphyr = { version = "1.0.0", default-features = false, features = ["deserialize"], optional = true }
rust-ini = { version = "0.21.3", default-features = false, optional = true }
base64 = { version = "0.23.0", default-features = false, features = ["std"], optional = true }
md5 = { package = "md-5", version = "0.11.0", default-features = false, optional = true }
aes = { version = "0.9.2", default-features = false, features = ["zeroize"], optional = true }
aes-gcm = { version = "0.11.0", default-features = false, features = ["aes", "alloc", "getrandom", "zeroize"], optional = true }
cbc = { version = "0.2.1", default-features = false, features = ["alloc", "block-padding", "zeroize"], optional = true }
zeroize = { version = "1.9.0", default-features = false, optional = true }
encoding_rs = { version = "0.8.35", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt-multi-thread"] }
