[package]
name = "axutils"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"
description = "Rust utility library with opt-in feature modules"
license = "MIT"
readme = "README.md"
repository = "https://github.com/crx-96/axutils-rust"
keywords = ["utilities", "validation", "regex"]
categories = ["development-tools"]

# Keep developer-only files out of the package published to crates.io.
include = ["Cargo.toml", "README.md", "LICENSE", "src/**"]

[lib]
name = "axutils"
path = "src/lib.rs"
crate-type = ["lib"]

[features]
default = []
rand = ["dep:rand"]
regex = ["dep:regex"]
libphonenumber = ["dep:libphonenumber"]
serde = ["dep:serde", "dep:serde_json"]
strfmt = ["dep:strfmt"]
minijinja = ["dep:minijinja"]
chrono = ["dep:chrono"]
time = ["dep:time"]
jiff = ["dep:jiff"]
lettre = ["dep:lettre"]
tokio = ["dep:tokio", "lettre?/tokio1-rustls"]

[dependencies]
rand = { version = "0.9", optional = true }
regex = { version = "1", optional = true }
libphonenumber = { package = "phonenumber", version = "0.3", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
strfmt = { version = "0.2", optional = true }
minijinja = { version = "2", default-features = false, features = ["serde"], optional = true }
chrono = { version = "0.4.45", default-features = false, optional = true }
time = { version = "0.3.36", default-features = false, optional = true }
jiff = { version = "0.2.35", default-features = false, optional = true }
lettre = { version = "0.11.22", default-features = false, optional = true, features = [
    "builder",
    "smtp-transport",
    "pool",
    "rustls",
    "ring",
    "webpki-roots",
] }
tokio = { version = "1.53.1", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt-multi-thread"] }
