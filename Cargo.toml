[package]
name = "axutils"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
description = "Rust utility library with opt-in feature modules"
license = "MIT"
readme = "README.md"
repository = "https://github.com/crx-96/axutils-rust"
keywords = ["utilities", "validation", "regex"]
categories = ["development-tools"]

# Keep developer-only files out of the package published to crates.io.
include = ["Cargo.toml", "README.md", "LICENSE", "src/**"]

[lib]
name = "axutils"
path = "src/lib.rs"
crate-type = ["lib"]

[features]
default = []
rand = ["dep:rand"]
regex = ["dep:regex"]
libphonenumber = ["dep:libphonenumber"]

[dependencies]
rand = { version = "0.9", optional = true }
regex = { version = "1", optional = true }
libphonenumber = { package = "phonenumber", version = "0.3", optional = true }
